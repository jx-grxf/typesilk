<!doctype html>
<html lang="en" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | typesilk</title>
    <meta name="theme-color" content="#0d0c0b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const { theme } = JSON.parse(localStorage.getItem("typesilk.settings") ?? "{}");
        if (["noir", "paper", "forest", "klein", "ash", "plum", "sepia", "void", "rosso"].includes(theme)) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/page.css" />
    <script type="module" src="/src/notfound.ts"></script>
  </head>
  <body class="nf">
    <header class="page-head"><a class="logo" href="/">typesilk</a></header>
    <main class="nf-main">
      <p class="nf-count">404</p>
      <div id="typed" class="nf-typed" aria-hidden="true"></div>
      <h1 class="nf-title">No page at this address.</h1>
      <p id="suggest" class="nf-suggest" hidden>Did you mean <a href="/"></a>?</p>
      <p class="nf-hint">
        <span hidden><kbd>enter</kbd> <span id="enter-hint"></span></span>
        <a href="/"><kbd>tab</kbd> start typing</a>
      </p>
    </main>
  </body>
</html>
