<!doctype html>
<html lang="en" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily typing test leaderboard | typesilk</title>
    <meta name="description" content="Everyone types the same 40 words each day. See who was fastest, in English, German, Spanish and French." />
    <link rel="canonical" href="https://typesilk.com/daily" />
    <meta name="theme-color" content="#0d0c0b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="typesilk" />
    <meta property="og:title" content="Daily typing test leaderboard" />
    <meta property="og:description" content="Everyone types the same 40 words each day. See who was fastest, in English, German, Spanish and French." />
    <meta property="og:url" content="https://typesilk.com/daily" />
    <meta property="og:image" content="https://typesilk.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const { theme } = JSON.parse(localStorage.getItem("typesilk.settings") ?? "{}");
        if (["noir", "paper", "forest", "klein"].includes(theme)) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/page.css" />
    <script type="module" src="/src/board.ts"></script>
  </head>
  <body>
    <header class="page-head">
      <a class="logo" href="/">typesilk</a>
      <nav aria-label="days" id="board-days"></nav>
    </header>
    <main class="page-body board">
      <h1 id="board-title">Daily</h1>
      <p class="lead">Everyone types the same 40 words each day. Your first finished try counts, and the server replays every keystroke before it ranks the run.</p>
      <a class="start" href="/?mode=daily">Type today's daily</a>
      <nav class="board-languages" id="board-languages" aria-label="language"></nav>
      <p class="board-status" id="board-status" role="status"></p>
      <ol class="board-list" id="board-list"></ol>
    </main>
    <footer class="page-foot">
      <span><a href="https://johannesgrof.me">Johannes Grof</a></span>
      <nav aria-label="legal"><a href="/about">about</a><a href="/impressum">imprint</a><a href="/privacy">privacy</a><a href="/terms">terms</a></nav>
    </footer>
  </body>
</html>
