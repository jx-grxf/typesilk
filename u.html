<!doctype html>
<html lang="en" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | typesilk</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0d0c0b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        const { theme } = JSON.parse(localStorage.getItem("typesilk.settings") ?? "{}");
        if (["noir", "paper", "forest", "klein", "ash", "plum", "sepia", "void", "rosso"].includes(theme)) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/page.css" />
    <script type="module" src="/src/public-profile.ts"></script>
  </head>
  <body>
    <header class="page-head">
      <a class="logo" href="/">typesilk</a>
    </header>
    <main class="page-body public-profile" id="public-profile">
      <p class="board-status" id="public-status" role="status">Loading the profile.</p>
    </main>
    <footer class="page-foot">
      <span><a href="https://johannesgrof.me">Johannes Grof</a></span>
      <nav aria-label="legal"><a href="/about">about</a><a href="/impressum">imprint</a><a href="/privacy">privacy</a><a href="/terms">terms</a></nav>
    </footer>
  </body>
</html>
