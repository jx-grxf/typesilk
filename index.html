<!doctype html>
<html lang="en" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A typing test that glides. Spring-driven type, real keyboard sound and a coach for your weak keys." />
    <meta name="theme-color" content="#0d0c0b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c0b'/%3E%3Crect x='14.5' y='5' width='3' height='22' fill='%23ff4f1f'/%3E%3C/svg%3E" />
    <title>typesilk</title>
  </head>
  <body>
    <header class="chrome">
      <div class="logo">typesilk</div>
      <div class="meta">
        <button id="daily-link" type="button"></button>
        <a id="profile-link" href="/me" aria-label="your profile">
          <span id="streak"><svg class="flame" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 1c.6 3.2 3.4 4.9 4.9 7.8 1.6 3.2.4 7.9-4.9 9.7-5.3-1.8-6.5-6.5-4.9-9.7.7 1.6 1.8 2.4 2.9 2.6C5.2 8.4 6.3 4.2 8 1z"/></svg><b></b></span>
          <span id="goal" hidden><span class="goal-track"><span class="goal-fill"></span></span></span>
          <span id="level"><b></b><span class="level-track"><span class="level-fill"></span></span></span>
        </a>
        <button id="open-settings" type="button">settings</button>
      </div>
    </header>

    <main id="main">
      <section id="typing">
        <div id="combo" aria-hidden="true"></div>
        <div id="anchor"><div id="hud"></div><div id="live" aria-hidden="true"></div></div>
        <div id="viewport">
          <div id="scroller">
            <div id="words"></div>
            <div id="ghost" aria-hidden="true"></div>
            <div id="caret" aria-hidden="true"></div>
          </div>
        </div>
        <div id="flow-track" aria-hidden="true"><div id="flow-line"></div></div>
      </section>
      <section id="results" aria-live="polite"></section>
      <section id="profile" aria-label="your typing"></section>
      <section id="touch-note">
        <p class="touch-title">typesilk needs a keyboard.</p>
        <p class="touch-text">Connect one to your phone or tablet and press any key, or open this page on a computer.</p>
      </section>
    </main>

    <footer class="chrome">
      <nav id="controls-left" aria-label="test setup"></nav>
      <div class="hint"><kbd>tab</kbd> restart &nbsp; <kbd>esc</kbd> <span id="esc-label">settings</span> &nbsp; <kbd class="palette-key">ctrl k</kbd> commands</div>
      <nav id="controls-right" aria-label="language"></nav>
    </footer>
    <div class="colophon chrome">
      <span><a href="https://johannesgrof.me">Johannes Grof</a> &middot; <a href="https://github.com/jx-grxf/typesilk">github</a></span>
      <span class="hint-short"><kbd>tab</kbd> restart &nbsp; <kbd class="palette-key">ctrl k</kbd> commands</span>
      <a id="version" href="https://github.com/jx-grxf/typesilk/releases"></a>
    </div>

    <div id="backdrop"></div>
    <aside id="panel" aria-label="settings" inert>
      <div class="panel-head"><h2>Settings</h2><button id="close-settings" type="button">close</button></div>
      <div id="panel-body"></div>
    </aside>

    <div id="palette" aria-label="commands" inert>
      <input id="palette-input" type="text" placeholder="search settings and actions" autocomplete="off" spellcheck="false" aria-label="search commands" aria-controls="palette-list" />
      <div id="palette-list" role="listbox"><span id="palette-hl" aria-hidden="true"></span></div>
      <div class="pal-foot"><span><kbd>&uarr;&darr;</kbd> choose</span><span><kbd>enter</kbd> run</span><span><kbd>esc</kbd> close</span></div>
    </div>

    <div id="custom" role="dialog" aria-label="your own text" inert>
      <label class="custom-head" for="custom-text">Your text</label>
      <textarea id="custom-text" spellcheck="false" placeholder="Paste or write anything. Line breaks become spaces."></textarea>
      <div class="custom-foot">
        <button id="custom-shuffle" class="toggle-word" type="button" aria-pressed="false">shuffle words</button>
        <span id="custom-count"></span>
        <span class="custom-actions">
          <button id="custom-cancel" type="button">cancel</button>
          <button id="custom-start" type="button"><kbd id="custom-key">ctrl enter</kbd> start</button>
        </span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
